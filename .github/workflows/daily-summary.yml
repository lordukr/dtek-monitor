name: Daily morning summary

on:
  # Розклад вимкнено: моніторинг працює на VPS (Docker). Щоб увімкнути - розкоментуйте.
  # schedule:
  #   # 00:10 UTC щодня = 02:10 (зима) / 03:10 (літо) за Києвом
  #   - cron: "10 0 * * *"
  workflow_dispatch:

jobs:
  daily-summary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Run daily summary script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CITY: ${{ secrets.CITY }}
          STREET: ${{ secrets.STREET }}
          HOUSE: ${{ secrets.HOUSE }}
        run: node daily-summary.js
