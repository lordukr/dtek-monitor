services:
  # Один контейнер: supercronic запускає monitor.js та daily-summary.js за файлом crontab
  monitor:
    build: .
    container_name: dtek-monitor
    restart: unless-stopped
    # tini як PID 1: коректна передача сигналів і прибирання зомбі-процесів supercronic
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - TZ=Europe/Kyiv
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - CITY=${CITY}
      - STREET=${STREET}
      - HOUSE=${HOUSE}
    volumes:
      # Зберігаємо артефакти (message-history.json) між запусками
      - ./artifacts:/app/artifacts
